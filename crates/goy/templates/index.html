<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{app_name}</title>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    let currentModule = null;

    async function boot(mod, savedStateJson) {
      await mod.default();
      if (savedStateJson) {
        mod.goyda_install_state(savedStateJson);
      }
      mod.goyda_start();
      currentModule = mod;
    }

    boot(await import("./{out_name}.js?v=0"), null);

    (function () {
      let lastSeen = null;
      setInterval(function () {
        fetch("/__goyda_reload")
          .then(function (r) { return r.text(); })
          .then(async function (id) {
            if (lastSeen === null) { lastSeen = id; return; }
            if (id === lastSeen) { return; }
            lastSeen = id;

            const savedStateJson = currentModule.goyda_dump_state();
            currentModule.goyda_teardown();
            await boot(await import("./{out_name}.js?v=" + id), savedStateJson);
          })
          .catch(function () {});
      }, 1000);
    })();
  </script>
</body>
</html>
