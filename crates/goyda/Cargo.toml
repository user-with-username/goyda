[package]
name = "goyda"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "dylib"]

[dependencies]
jni = { version = "0.21.1", features = ["invocation"], optional = true }
goyda-macros = { path = "../goyda-macros" }
goyda-utils = { path = "../goyda-utils" }
once_cell = "1.21.4"
inventory = "0.3.15"
paste = "1.0"
goyda-derive = { path = "../goyda-derive" }
wasm-bindgen = { version = "0.2.100", optional = true }
js-sys = { version = "0.3.77", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
resvg = { version = "0.48.1", default-features = false, optional = true }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_Graphics_GdiPlus", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_System_DataExchange"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"], optional = true }

[dependencies.web-sys]
version = "0.3.77"
optional = true
features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "CssStyleDeclaration",
    "Node",
    "Event",
    "MouseEvent",
    "FocusEvent",
    "InputEvent",
    "EventTarget",
    "Location",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "History",
    "PopStateEvent",
    "MediaQueryList",
    "Storage",
]

[features]
default = []
android = ["dep:jni", "dep:resvg"]
web = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys", "dep:console_error_panic_hook"]
windows = ["dep:windows-sys", "dep:resvg", "dep:image"]
