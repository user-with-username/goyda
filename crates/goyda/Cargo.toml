[package]
name = "goyda"
version = "0.1.0"
edition = "2024"

[dependencies]
jni = { version = "0.21.1", features = ["invocation"], optional = true }
goyda-macros = { path = "../goyda-macros" }
goyda-utils = { path = "../goyda-utils" }
once_cell = "1.21.4"
inventory = "0.3.15"
paste = "1.0"
goyda-derive = { path = "../goyda-derive" }
wasm-bindgen = { version = "0.2.100", optional = true }
js-sys = { version = "0.3.77", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
resvg = { version = "0.48.1", default-features = false, optional = true }

[dependencies.web-sys]
version = "0.3.77"
optional = true
features = [
    "console",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlHeadElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "CssStyleDeclaration",
    "Node",
    "Event",
    "MouseEvent",
    "FocusEvent",
    "InputEvent",
    "EventTarget",
    "Location",
    "Blob",
    "BlobPropertyBag",
    "Url",
]

[features]
default = []
android = ["dep:jni", "dep:resvg"]
web = ["dep:wasm-bindgen", "dep:web-sys", "dep:js-sys", "dep:console_error_panic_hook"]
