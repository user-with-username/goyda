[package]
name = "goyda-macros"
version = "0.1.0"
edition = "2021"

[dependencies]
# Note: this crate only ever *emits* paths like `::jni::...`, `::paste::paste!`,
# and `::inventory::submit!` as tokens inside macro_rules! bodies - those
# resolve in the crate where the macro is expanded (goyda), not here. Nothing
# in this crate's own compiled code touches jni/paste/inventory directly, so
# it deliberately has no dependency on any of them (keeps this crate, and by
# extension every non-android target, free of the native `jni` dependency).